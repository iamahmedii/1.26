<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Words by Cork</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#fbf3e8" />
<style>
/* Brand fonts — vendored locally (offline) */
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Baloo 2";src:url("fonts/Baloo2-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Baloo 2";src:url("fonts/Baloo2-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Baloo 2";src:url("fonts/Baloo2-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

/* launch splash (covers the brief mount, then fades) */
#splash{position:fixed;inset:0;z-index:9999;background:#fbf3e8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",system-ui,sans-serif;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .dot{width:74px;height:74px;border-radius:50%;background:#f44d18;box-shadow:0 10px 30px rgba(244,77,24,.35)}
#splash .nm{margin-top:20px;font-size:26px;font-weight:800;color:#17161a;letter-spacing:-.01em}
#splash .tg{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#9a8f82}
#splash .bar{position:absolute;bottom:14%;width:150px;height:4px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
#splash .bar i{display:block;height:100%;width:42%;background:#1E8FD0;border-radius:999px;animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
@font-face{font-family:"Cairo";src:url("fonts/Cairo-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Cairo";src:url("fonts/Cairo-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Cairo";src:url("fonts/Cairo-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
</style>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="splash">
  <svg width="208" height="125" viewBox="0 0 240 144" fill="none" aria-label="Cork">
    <path d="M40 58 C 76 28 116 28 150 47 C 173 60 197 57 214 42" stroke="#3FC2D8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M26 80 C 70 49 120 53 158 70 C 179 79 199 76 216 63" stroke="#1E8FD0" stroke-width="12" stroke-linecap="round" fill="none"/>
    <text x="121" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-weight="800" font-size="54" letter-spacing="3" fill="#1E8FD0">CORK</text>
  </svg>
  <div class="tg" style="color:#1E8FD0;margin-top:8px">Information Technology</div>
  <div class="bar"><i></i></div>
</div>
<div id="root"></div>

<script src="native.js"></script>
<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="data.js"></script>
<script src="data_ar.js"></script>
<script src="defs_ar.js"></script>
<script src="defs.js"></script>
<script src="i18n.js"></script>
<script src="sound.js"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="frames/android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wheel.jsx"></script>
<script type="text/babel" src="grid.jsx"></script>
<script type="text/babel" src="game.jsx"></script>
<script type="text/babel" src="mascot.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
(function () {
  var s = document.getElementById("splash"); if (!s) return;
  var t0 = Date.now();
  (function chk(){ var r = document.getElementById("root");
    if ((r && r.children.length) || Date.now() - t0 > 4000) { s.classList.add("hide"); setTimeout(function(){ s.remove(); }, 500); }
    else setTimeout(chk, 120);
  })();
})();
</script>
</body>
</html>
