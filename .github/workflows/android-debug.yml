name: Android debug APK

# Builds an installable debug .apk on GitHub's servers (which can reach Google's
# Android SDK + Maven). Download it from the run's "Artifacts" and sideload onto a phone.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web bundle (www/)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add AdMob App ID to AndroidManifest
        # Re-applied every build because the android/ folder is regenerated above.
        # Uses Google's TEST App ID by default (safe). To ship real ads, set the
        # ADMOB_APP_ID env (or edit scripts/inject-admob.js) to your real App ID.
        continue-on-error: true
        run: node scripts/inject-admob.js

      - name: Make system bars transparent (edge-to-edge)
        # Removes the white status/navigation bar strips so the app fills the screen.
        continue-on-error: true
        run: node scripts/android-edge-to-edge.js

      - name: Enable immersive full-screen (hide system bars)
        # Hides the status + nav bars so the game fills the whole phone.
        continue-on-error: true
        run: node scripts/android-immersive.js

      - name: Generate app icon & splash (best effort)
        continue-on-error: true
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#101010' --iconBackgroundColorDark '#101010' \
            --splashBackgroundColor '#101010' --splashBackgroundColorDark '#101010'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cork-word-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
